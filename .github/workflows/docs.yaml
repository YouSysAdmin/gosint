#
# Builds the documentation in docs/ and publishes it on GitHub Pages.
# The theme is a Hugo module, so the build needs Go as well as Hugo.
name: Docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with: { go-version: '1.27.2', cache: false }

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: docs
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
