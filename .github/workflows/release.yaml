# Gosint, Copyright (c) 2026 YouSysAdmin
name: Release
on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so goreleaser sees the previous tag for the
      # changelog.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with: { go-version: '1.27.2' }

      # Node builds the console, which the binary embeds.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # QEMU so the arm64 image can be built on an amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The desktop app links the system web view through cgo, so each
  # platform builds on its own runner and uploads beside the release.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    # Git Bash on Windows, so one script packs everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with: { go-version: '1.27.2' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the toolkit
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install librsvg
          elif [ "$RUNNER_OS" = Windows ]; then
            # MinGW gcc for cgo comes with the runner.
            gcc --version
            go install github.com/tc-hib/go-winres@v0.3.3
          else
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          fi

      - name: Build the console
        working-directory: web
        run: npm ci && npm run build

      - name: Pack
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: scripts/desktop-package.sh

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          for f in gosint-desktop_*; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" >"$f.sha256"
            else
              shasum -a 256 "$f" >"$f.sha256"
            fi
          done
          gh release upload "$TAG" gosint-desktop_* --clobber
